name: Deploy to GitHub Pages

on:
  workflow_dispatch: # 이 설정이 깃허브 웹 화면에 "Run workflow" 수동 실행 버튼을 생성합니다.
  push:
    branches:
      - main # main 브랜치에 코드가 푸시될 때도 자동 실행되도록 지원합니다.

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
